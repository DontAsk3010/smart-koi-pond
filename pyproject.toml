[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-koi-pond"
version = "0.1.0"
description = "Governed Smart Koi Pond closed-loop Digital Twin and control system"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Smart Koi Pond Project"}]
dependencies = []

[project.scripts]
smart-koi-pond-ui = "smart_koi_pond.dashboard.app:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
