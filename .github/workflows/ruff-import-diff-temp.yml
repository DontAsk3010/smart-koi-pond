name: Ruff Import Fix TEMP

on:
  push:
    branches:
      - koi-stock-water-quality-recovery-v1

permissions:
  contents: write

jobs:
  import-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: koi-stock-water-quality-recovery-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.16.7
      - name: Apply Ruff import fixes and push
        run: |
          ruff check --select I --fix src/smart_koi_pond/digital_twin/koi_stock.py tests/test_koi_stock_water_quality_recovery.py
          if git diff --quiet; then
            echo "No import fixes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/smart_koi_pond/digital_twin/koi_stock.py tests/test_koi_stock_water_quality_recovery.py
          git commit -m "Apply Ruff import formatting"
          git push origin HEAD:koi-stock-water-quality-recovery-v1
