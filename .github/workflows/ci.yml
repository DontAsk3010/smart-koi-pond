name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Build V1 regression evidence
        run: >-
          python -m smart_koi_pond.scenarios.regression_matrix
          --output artifacts/v1-regression-matrix-${{ matrix.python-version }}.json

      - name: Build modular-platform evidence
        run: >-
          python -m smart_koi_pond.scenarios.modular_matrix
          --output artifacts/modular-platform-matrix-${{ matrix.python-version }}.json

      - name: Build animated-pond evidence
        run: >-
          python scripts/animated_pond_matrix.py
          > artifacts/animated-pond-matrix-${{ matrix.python-version }}.json

      - name: Build Simulation Exit SIL evidence
        run: >-
          python -m smart_koi_pond.scenarios.sil_stress_matrix
          --output artifacts/simulation-exit-sil-${{ matrix.python-version }}.json

      - name: Build G0 HIL-entry software evidence
        run: >-
          python -m smart_koi_pond.scenarios.hil_entry_software_matrix
          --output artifacts/g0-hil-entry-software-${{ matrix.python-version }}.json

      - name: Build virtual fault/recovery evidence
        run: >-
          python -m smart_koi_pond.scenarios.virtual_fault_recovery_matrix
          --output artifacts/virtual-fault-recovery-${{ matrix.python-version }}.json

      - name: Build hydraulic profile fidelity evidence
        run: >-
          python -m smart_koi_pond.scenarios.hydraulic_profile_matrix
          --output artifacts/hydraulic-profile-fidelity-${{ matrix.python-version }}.json

      - name: Upload V1 regression evidence
        uses: actions/upload-artifact@v4
        with:
          name: v1-regression-matrix-python-${{ matrix.python-version }}
          path: artifacts/v1-regression-matrix-${{ matrix.python-version }}.json

      - name: Upload modular-platform evidence
        uses: actions/upload-artifact@v4
        with:
          name: modular-platform-matrix-python-${{ matrix.python-version }}
          path: artifacts/modular-platform-matrix-${{ matrix.python-version }}.json

      - name: Upload animated-pond evidence
        uses: actions/upload-artifact@v4
        with:
          name: animated-pond-matrix-python-${{ matrix.python-version }}
          path: artifacts/animated-pond-matrix-${{ matrix.python-version }}.json

      - name: Upload Simulation Exit SIL evidence
        uses: actions/upload-artifact@v4
        with:
          name: simulation-exit-sil-python-${{ matrix.python-version }}
          path: artifacts/simulation-exit-sil-${{ matrix.python-version }}.json

      - name: Upload G0 HIL-entry software evidence
        uses: actions/upload-artifact@v4
        with:
          name: g0-hil-entry-software-python-${{ matrix.python-version }}
          path: artifacts/g0-hil-entry-software-${{ matrix.python-version }}.json

      - name: Upload virtual fault/recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: virtual-fault-recovery-python-${{ matrix.python-version }}
          path: artifacts/virtual-fault-recovery-${{ matrix.python-version }}.json

      - name: Upload hydraulic profile fidelity evidence
        uses: actions/upload-artifact@v4
        with:
          name: hydraulic-profile-fidelity-python-${{ matrix.python-version }}
          path: artifacts/hydraulic-profile-fidelity-${{ matrix.python-version }}.json
