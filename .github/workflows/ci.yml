name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Build V1 regression evidence
        run: >-
          python -m smart_koi_pond.scenarios.regression_matrix
          --output artifacts/v1-regression-matrix-${{ matrix.python-version }}.json

      - name: Upload V1 regression evidence
        uses: actions/upload-artifact@v4
        with:
          name: v1-regression-matrix-python-${{ matrix.python-version }}
          path: artifacts/v1-regression-matrix-${{ matrix.python-version }}.json
